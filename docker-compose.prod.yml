services:
  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - eacy

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-latest}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -lc
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LITELLM_USE_CHAT_COMPLETIONS_URL_FOR_ANTHROPIC_MESSAGES: "true"
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-localhost,127.0.0.1,redis,api,litellm,.local}}
      no_proxy: ${no_proxy:-${NO_PROXY:-localhost,127.0.0.1,redis,api,litellm,.local}}
    command:
      - |
        cat >/tmp/litellm_config.yaml <<'EOF'
        model_list:
          - model_name: ${OPENAI_MODEL:-gpt-4o-mini}
            litellm_params:
              model: openai/${OPENAI_MODEL:-gpt-4o-mini}
              api_base: os.environ/OPENAI_API_BASE_URL
              api_key: os.environ/OPENAI_API_KEY
        litellm_settings:
          drop_params: true
          set_verbose: false
        EOF
        exec litellm --config /tmp/litellm_config.yaml --host 0.0.0.0 --port 4000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eacy

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11.7-slim}
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: eacy-backend:prod
    restart: "no"
    env_file:
      - ${EACY_ENV_FILE:-.env.prod}
    environment:
      ENV: prod
      DEBUG: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eacy

  api:
    image: eacy-backend:prod
    restart: unless-stopped
    env_file:
      - ${EACY_ENV_FILE:-.env.prod}
    environment:
      ENV: prod
      DEBUG: "false"
    command:
      - gunicorn
      - app.server:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -b
      - 0.0.0.0:8000
      - --workers
      - "${API_WORKERS:-2}"
      - --timeout
      - "${API_TIMEOUT_SECONDS:-180}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - eacy

  worker-ocr:
    image: eacy-backend:prod
    restart: unless-stopped
    env_file:
      - ${EACY_ENV_FILE:-.env.prod}
    environment:
      ENV: prod
      DEBUG: "false"
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - -Q
      - ocr
      - --loglevel=info
      - --concurrency=${OCR_CONCURRENCY:-1}
      - --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-20}
      - --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      - -n
      - eacy-ocr@%h
    depends_on:
      api:
        condition: service_healthy
    networks:
      - eacy

  celery-beat:
    image: eacy-backend:prod
    restart: unless-stopped
    env_file:
      - ${EACY_ENV_FILE:-.env.prod}
    environment:
      ENV: prod
      DEBUG: "false"
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - beat
      - --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - eacy

  worker-metadata:
    image: eacy-backend:prod
    restart: unless-stopped
    env_file:
      - ${EACY_ENV_FILE:-.env.prod}
    environment:
      ENV: prod
      DEBUG: "false"
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - -Q
      - metadata,maintenance
      - --loglevel=info
      - --concurrency=${METADATA_CONCURRENCY:-1}
      - --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-20}
      - --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      - -n
      - eacy-metadata@%h
    depends_on:
      api:
        condition: service_healthy
    networks:
      - eacy

  worker-extraction:
    image: eacy-backend:prod
    restart: unless-stopped
    env_file:
      - ${EACY_ENV_FILE:-.env.prod}
    environment:
      ENV: prod
      DEBUG: "false"
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - -Q
      - extraction
      - --loglevel=info
      - --concurrency=${EXTRACTION_CONCURRENCY:-2}
      - --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-20}
      - --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      - -n
      - eacy-extraction@%h
    depends_on:
      api:
        condition: service_healthy
    networks:
      - eacy

  worker-claude-code:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11.7-slim}
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        INSTALL_CLAUDE_CODE: "true"
        CLAUDE_CODE_CLI_SOURCE: ${CLAUDE_CODE_CLI_SOURCE:-cc-haha}
        CC_HAHA_ARCHIVE_URL: ${CC_HAHA_ARCHIVE_URL:-https://codeload.github.com/NanmiCoder/cc-haha/tar.gz/refs/heads/main}
    image: eacy-backend-claude-code:prod
    restart: unless-stopped
    env_file:
      - ${EACY_ENV_FILE:-.env.prod}
    environment:
      ENV: prod
      DEBUG: "false"
      CLAUDE_CODE_BIN: claude-haha
      CC_HAHA_SKIP_DOTENV: "1"
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-1}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-${LITELLM_PROXY_KEY:-sk-eacy-local}}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://litellm:4000}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-${OPENAI_MODEL:-}}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-${OPENAI_MODEL:-}}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-${OPENAI_MODEL:-}}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-${OPENAI_MODEL:-}}
      API_TIMEOUT_MS: ${CLAUDE_CODE_API_TIMEOUT_MS:-300000}
      HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      ALL_PROXY: ${ALL_PROXY:-${all_proxy:-}}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-localhost,127.0.0.1,redis,api,.local}}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
      all_proxy: ${all_proxy:-${ALL_PROXY:-}}
      no_proxy: ${no_proxy:-${NO_PROXY:-localhost,127.0.0.1,redis,api,.local}}
    volumes:
      - ${CLAUDE_CODE_CREDENTIALS_DIR:-/root/.claude}:/home/eacy/.claude
      - ${CLAUDE_CODE_CONFIG_FILE:-/root/.claude.json}:/home/eacy/.claude.json
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - -Q
      - claude-code
      - --loglevel=info
      - --concurrency=${CLAUDE_CODE_CONCURRENCY:-1}
      - --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-20}
      - --prefetch-multiplier=1
      - -n
      - eacy-claude-code@%h
    depends_on:
      litellm:
        condition: service_started
      api:
        condition: service_healthy
    networks:
      - eacy

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:20-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: eacy-frontend:prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - eacy

volumes:
  redis-data:

networks:
  eacy:
    driver: bridge
