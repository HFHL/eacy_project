<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易悉EACY - 微信登录</title>
    <link rel="stylesheet" href="./wechat-login-index.css">
</head>
<body>
    <div class="container">
        <!-- 左侧登录面板 -->
        <div class="login-panel">
            <div class="login-header">
                <div class="register-link">
                    <a href="#">注册</a>
                </div>
                <div class="login-tabs">
                    <div class="tab active">微信登录</div>
                    <div class="tab">邮箱登录</div>
                </div>
            </div>

            <div class="qr-section">
                <div class="qr-container" id="qrContainer">
                    <div class="qr-loading" id="qrLoading">正在生成二维码...</div>
                    <div class="qr-image" id="qrImage" style="display: none;"></div>
                </div>
                <div class="qr-tips">
                    使用微信扫一扫<br>
                    扫描上方二维码登录
                </div>
            </div>

            <div class="last-login">
                <div class="last-login-title">上次登录</div>
                <div class="login-methods">
                    <div class="method-btn wechat">
                        <span>微信</span>
                    </div>
                    <div class="method-btn">
                        <span>企业微信</span>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="other-methods">
                <div class="other-method">
                    <div class="other-method-icon">QQ</div>
                    <span>QQ</span>
                </div>
                <div class="other-method">
                    <div class="other-method-icon">小程序</div>
                    <span>小程序公众号</span>
                </div>
                <div class="other-method">
                    <div class="other-method-icon">👤</div>
                    <span>子用户</span>
                </div>
            </div>

            <div class="help-links">
                <a href="#">忘记账号</a>
                <span>|</span>
                <a href="#">忘记密码</a>
                <span>|</span>
                <a href="#">登录异常帮助文档</a>
            </div>
        </div>

        <!-- 右侧宣传区域 -->
        <div class="promo-panel">
            <div class="promo-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
            </div>
            <div class="promo-content">
                <h1 class="promo-title">易悉EACY</h1>
                <div class="promo-subtitle">
                    智能医疗数据平台<br>
                    AI驱动的科研数据管理<br>
                    让数据创造价值
                </div>
                <button class="promo-button">
                    <span>了解更多</span>
                </button>
            </div>
        </div>
    </div>
    <script src="./wechat-login-index.js"></script>
</body>
</html>
